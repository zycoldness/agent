rlhf_type: grpo
model: __MODEL__
adapters: __ADAPTER__
tuner_type: lora
torch_dtype: bfloat16
dataset: __TRAIN_DATASET__
val_dataset: __VAL_DATASET__
output_dir: __OUTPUT_DIR__
external_plugins: __EXTERNAL_PLUGIN__
reward_funcs:
  - risk_format_v1
  - risk_label_exact_v1
  - risk_rule_exact_v1
  - risk_evidence_exact_v1
reward_weights: [0.2, 0.4, 0.25, 0.15]
use_vllm: false
remove_unused_columns: false
num_generations: 4
max_prompt_length: 2048
max_completion_length: 256
per_device_train_batch_size: 4
per_device_eval_batch_size: 4
gradient_accumulation_steps: 4
gradient_checkpointing: true
learning_rate: 0.00001
num_train_epochs: 1
lora_rank: 8
lora_alpha: 16
target_modules: all-linear
logging_steps: 1
save_steps: 50
eval_steps: 50
save_total_limit: 2
warmup_ratio: 0.03
report_to: none
strict: true
